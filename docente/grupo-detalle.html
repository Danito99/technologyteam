<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechAcademia — Detalle de grupo</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:14px; }
    .tab  { font-size:12px; padding:7px 16px; cursor:pointer; color:var(--text-3); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
    .tab.active { color:var(--az); border-bottom-color:var(--az); font-weight:500; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }

    /* Sesiones */
    .sesion-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12px; }
    .sesion-row:last-child { border-bottom:none; }
    .s-dot  { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .s-num  { font-size:10px; color:var(--text-3); min-width:22px; }
    .s-title{ flex:1; }
    .s-title.done { color:var(--text-3); text-decoration:line-through; text-decoration-color:var(--vd); }
    .s-date { font-size:10px; color:var(--text-3); }

    /* Calificaciones */
    .cal-table { width:100%; border-collapse:collapse; font-size:11px; }
    .cal-table th { text-align:left; font-size:10px; font-weight:600; color:var(--text-3); padding:5px 7px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.04em; }
    .cal-table td { padding:6px 7px; border-bottom:1px solid var(--border); vertical-align:middle; }
    .cal-table tr:last-child td { border-bottom:none; }
    .cal-input { width:48px; font-size:11px; padding:3px 5px; border:1px solid var(--border-m); border-radius:4px; text-align:center; background:var(--bg); }
    .cal-input:focus { outline:none; border-color:var(--az); background:white; }
    .prom-cell { font-weight:600; }

    /* Historial */
    .hist-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; }
    .hist-row:last-child { border-bottom:none; }

    .materia-sel { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
    .msel { font-size:11px; padding:4px 12px; border-radius:99px; border:1px solid var(--border-m); cursor:pointer; color:var(--text-2); }
    .msel.active { background:var(--az); color:white; border-color:var(--az); }

    .save-bar {
      position:sticky; bottom:0; background:var(--bg-card);
      border-top:1px solid var(--border); padding:10px 20px;
      display:none; align-items:center; justify-content:space-between;
      margin:0 -20px -20px; z-index:10;
    }
    .toast { position:fixed; bottom:70px; right:20px; background:var(--vd); color:white; padding:10px 16px; border-radius:var(--radius-s); font-size:12px; z-index:200; display:none; }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-area">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Grupo</div>
        <div class="topbar-sub" id="topbar-sub">Cargando...</div>
      </div>
      <button class="btn" onclick="window.location.href='grupos.html'">← Grupos</button>
    </div>

    <div class="page-content">
      <div id="loading" class="loading">Cargando...</div>
      <div id="content" style="display:none;">

        <div class="metrics-grid" id="metricas" style="margin-bottom:14px;"></div>

        <!-- Selector de materia (si hay más de una) -->
        <div class="materia-sel" id="materia-sel"></div>

        <!-- Selector de periodo -->
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
          <label style="font-size:11px;color:var(--text-3);">Periodo:</label>
          <select id="sel-periodo" style="width:auto;margin:0;font-size:11px;" onchange="onPeriodoChange()">
            <option value="">Selecciona...</option>
          </select>
        </div>

        <div class="tabs">
          <div class="tab active" onclick="setTab('sesiones',this)">Sesiones</div>
          <div class="tab" onclick="setTab('alumnos',this)">Alumnos</div>
        </div>

        <!-- SESIONES -->
        <div class="tab-content active" id="tab-sesiones">
          <div class="card">
            <div class="flex-between mb-8">
              <div class="card-title mb-0">Sesiones del periodo</div>
              <button class="btn btn-sm btn-primary" id="btn-add-sesion">+ Agregar sesión</button>
            </div>
            <div id="lista-sesiones"></div>
          </div>
        </div>

        <!-- ALUMNOS -->
        <div class="tab-content" id="tab-alumnos">
          <div class="card">
            <div class="flex-between mb-8">
              <div class="card-title mb-0" id="alumnos-titulo">Alumnos</div>
              <a href="materias.html" class="btn btn-sm">Gestionar alumnos</a>
            </div>
            <div id="lista-alumnos-tab"></div>
          </div>
        </div>


      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-sesion" style="display:none;">
  <div class="modal" style="max-width:420px;" onclick="event.stopPropagation()">
    <div style="font-size:15px;font-weight:600;margin-bottom:14px;">Nueva sesión</div>
    <label class="form-label">Título</label>
    <input type="text" id="modal-titulo-sesion"
           style="width:100%;margin-bottom:18px;"
           placeholder="Ej: Introducción al tema..." maxlength="120">
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn" id="btn-cancelar-sesion">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-sesion">Agregar sesión</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth }                from '../js/auth.js'
  import { renderSidebar }              from '../js/sidebar-docente.js'
  import { supabase }                   from '../js/supabase.js'
  import { mostrarToast }               from '../js/utils.js'

  const profile = await requireAuth('docente')
  if (!profile) throw new Error('No autenticado')
  await renderSidebar('grupos')

  const params   = new URLSearchParams(window.location.search)
  const grupoId  = params.get('id')
  const nombreGrupo = decodeURIComponent(params.get('nombre') || '')

  if (!grupoId) { window.location.href = 'grupos.html'; throw new Error('Sin grupo') }

  document.getElementById('topbar-title').textContent = nombreGrupo

  let gmSelId   = null
  let periodoId = null
  let alumnos   = []
  let sesiones  = []

  // ── Ciclo activo ──────────────────────────────────────────
  const { data: ciclo } = await supabase
    .from('ciclos_escolares').select('id,nombre').eq('activo',true).single()

  // ── Cargar grupo ──────────────────────────────────────────
  const { data: grupo } = await supabase
    .from('grupos')
    .select('id,nombre,nivel,grado,sistema_periodos, grupo_materias(id, materias(nombre)), alumnos(id,nombre,apellido,activo)')
    .eq('id', grupoId).single()

  document.getElementById('topbar-sub').textContent =
    `${grupo?.nivel} · ${ciclo?.nombre}`

  alumnos = grupo?.alumnos?.filter(a => a.activo) || []
  document.getElementById('alumnos-titulo').textContent = `Alumnos (${alumnos.length})`

  // Métricas
  document.getElementById('metricas').innerHTML = `
    <div class="metric"><div class="metric-label">Alumnos</div><div class="metric-value blue">${alumnos.length}</div></div>
    <div class="metric"><div class="metric-label">Materias</div><div class="metric-value">${grupo?.grupo_materias?.length || 0}</div></div>
  `

  // ── Selector de materia ───────────────────────────────────
  const gms = grupo?.grupo_materias || []
  const matSel = document.getElementById('materia-sel')

  if (gms.length > 1) {
    gms.forEach((gm, i) => {
      const btn = document.createElement('button')
      btn.className = 'msel' + (i === 0 ? ' active' : '')
      btn.textContent = gm.materias?.nombre || '—'
      btn.onclick = () => {
        document.querySelectorAll('.msel').forEach(b => b.classList.remove('active'))
        btn.classList.add('active')
        gmSelId = gm.id
        cargarPeriodos()
      }
      matSel.appendChild(btn)
    })
    gmSelId = gms[0].id
  } else if (gms.length === 1) {
    gmSelId = gms[0].id
    matSel.style.display = 'none'
  }

  // ── Periodos ──────────────────────────────────────────────
  const sistema = grupo?.sistema_periodos
  const tipo = sistema === 'semestral' ? 'semestre' : 'trimestre'
  const soloTrimestre = sistema === 'trimestral'

  let pq = supabase.from('periodos').select('id,etiqueta,numero,parcial')
    .eq('ciclo_id', ciclo.id).eq('tipo', tipo).order('numero').order('parcial')
  if (soloTrimestre) pq = pq.eq('parcial', 1)
  const { data: rawPeriodos } = await pq
  const periodos = (rawPeriodos || []).map(p =>
    soloTrimestre ? { ...p, etiqueta: `T${p.numero}` } : p
  )

  const selPeriodo = document.getElementById('sel-periodo')
  periodos?.forEach((p, i) => {
    const o = document.createElement('option')
    o.value = p.id; o.textContent = p.etiqueta
    selPeriodo.appendChild(o)
  })
  if (periodos?.length) {
    periodoId = periodos[0].id
    selPeriodo.value = periodoId
  }

  document.getElementById('loading').style.display = 'none'
  document.getElementById('content').style.display = 'block'

  window.onPeriodoChange = () => {
    periodoId = selPeriodo.value
    cargarContenido()
  }

  await cargarContenido()

  async function cargarContenido() {
    if (!gmSelId || !periodoId) return
    await Promise.all([cargarSesiones(), cargarAlumnos()])
  }

  // ── SESIONES ──────────────────────────────────────────────
  async function cargarSesiones() {
    const { data } = await supabase
      .from('sesiones')
      .select('id,numero,titulo,completada,fecha_completada')
      .eq('grupo_materia_id', gmSelId)
      .eq('periodo_id', periodoId)
      .order('numero')
    sesiones = data || []
    renderSesiones()
  }

  function renderSesiones() {
    const lista = document.getElementById('lista-sesiones')
    if (!sesiones.length) {
      lista.innerHTML = '<div class="empty-state"><p>Sin sesiones registradas. Agrégalas desde el plan de clase o con el botón +.</p></div>'
      return
    }
    lista.innerHTML = sesiones.map((s, i) => {
      const dotClass = s.completada ? 'dot-verde' : 'dot-ambar'
      const titleClass = s.completada ? 'done' : ''
      const fecha = s.fecha_completada
        ? new Date(s.fecha_completada).toLocaleDateString('es-MX', {day:'numeric',month:'short'})
        : ''
      const editorUrl = `sesion-editor.html?gmId=${gmSelId}&pId=${periodoId}&sesionId=${s.id}`
      return `
        <div class="sesion-row" style="cursor:pointer;" onclick="abrirSesion('${s.id}','${editorUrl}')">
          <span class="s-dot ${dotClass}"></span>
          <span class="s-num">${String(s.numero).padStart(2,'0')}</span>
          <span class="s-title ${titleClass}">${s.titulo || 'Sin título'}</span>
          <span class="s-date">${fecha}</span>
          ${!s.completada
            ? `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();marcarVista('${s.id}')">Marcar vista</button>`
            : `<span class="chip chip-green" style="font-size:10px;">Vista ✓</span>`}
        </div>`
    }).join('')
  }

  window.abrirSesion = async (sesionId, url) => {
    await supabase.from('sesiones').update({
      completada: true, fecha_completada: new Date().toISOString()
    }).eq('id', sesionId)
    window.location.href = url
  }

  window.marcarVista = async (sesionId) => {
    await supabase.from('sesiones').update({
      completada: true, fecha_completada: new Date().toISOString()
    }).eq('id', sesionId)
    mostrarToast('Sesión marcada como vista ✓')
    await cargarSesiones()
  }

  const modalSesion = document.getElementById('modal-sesion')
  const inputTitulo = document.getElementById('modal-titulo-sesion')

  document.getElementById('btn-add-sesion').addEventListener('click', () => {
    inputTitulo.value = ''
    modalSesion.style.display = 'flex'
    setTimeout(() => inputTitulo.focus(), 50)
  })

  document.getElementById('btn-cancelar-sesion').addEventListener('click', () => {
    modalSesion.style.display = 'none'
  })

  modalSesion.addEventListener('click', e => {
    if (e.target === modalSesion) modalSesion.style.display = 'none'
  })

  inputTitulo.addEventListener('keydown', e => {
    if (e.key === 'Enter')  document.getElementById('btn-confirmar-sesion').click()
    if (e.key === 'Escape') modalSesion.style.display = 'none'
  })

  document.getElementById('btn-confirmar-sesion').addEventListener('click', async () => {
    const titulo = inputTitulo.value.trim()
    if (!titulo) { inputTitulo.focus(); return }
    modalSesion.style.display = 'none'
    await supabase.from('sesiones').insert({
      grupo_materia_id: gmSelId, periodo_id: periodoId,
      numero: sesiones.length + 1, titulo
    })
    await cargarSesiones()
  })

  // ── ALUMNOS ───────────────────────────────────────────────
  async function cargarAlumnos() {
    const lista = document.getElementById('lista-alumnos-tab')
    if (!alumnos.length) {
      lista.innerHTML = '<div class="empty-state"><p>Sin alumnos. <a href="materias.html">Agrégalos aquí.</a></p></div>'
      return
    }
    lista.innerHTML = `<table class="cal-table">
      <thead><tr><th>#</th><th>Apellidos, Nombre</th><th>Estado</th></tr></thead>
      <tbody>${alumnos.map((a, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><strong style="font-weight:500;">${a.apellido}</strong>, ${a.nombre}</td>
          <td><span class="chip chip-green">Activo</span></td>
        </tr>`).join('')}
      </tbody>
    </table>`
  }

  // ── Tabs ──────────────────────────────────────────────────
  window.setTab = (id, el) => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'))
    el.classList.add('active')
    document.getElementById(`tab-${id}`).classList.add('active')
  }

  window.cargarPeriodos = async () => { await cargarContenido() }

</script>
</body>
</html>
