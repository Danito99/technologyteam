<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechAcademia — Indicadores propuestos</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    .prop-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-m);
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .prop-card.pendiente { border-left: 3px solid var(--am); }
    .prop-card.aprobado  { border-left: 3px solid var(--vd); }
    .prop-card.rechazado { border-left: 3px solid var(--co); }
    .prop-meta { font-size:11px; color:var(--text-3); margin-bottom:6px; display:flex; flex-wrap:wrap; gap:6px; }
    .prop-meta span { background:var(--bg-row); padding:2px 7px; border-radius:10px; }
    .prop-texto { font-size:13px; color:var(--text); margin:8px 0 12px; line-height:1.5; }
    .prop-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .btn-aprobar  { padding:5px 14px; background:var(--vd); color:white; border:none; border-radius:var(--radius-s); cursor:pointer; font-size:12px; font-weight:600; }
    .btn-rechazar { padding:5px 14px; background:var(--co); color:white; border:none; border-radius:var(--radius-s); cursor:pointer; font-size:12px; font-weight:600; }
    .btn-eliminar { padding:5px 14px; background:transparent; border:1px solid var(--border); border-radius:var(--radius-s); cursor:pointer; font-size:12px; color:var(--text-2); }
    .estado-badge { display:inline-block; font-size:10px; font-weight:600; padding:2px 8px; border-radius:10px; text-transform:uppercase; }
    .estado-pendiente { background:var(--am-l); color:var(--am); }
    .estado-aprobado  { background:#e6f4ea; color:var(--vd); }
    .estado-rechazado { background:#fdecea; color:var(--co); }
    .nota-rechazo { font-size:12px; color:var(--text-2); font-style:italic; margin-top:4px; }
    .filtros { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .filtro-btn { padding:5px 12px; border:1px solid var(--border); border-radius:20px; background:transparent; cursor:pointer; font-size:12px; }
    .filtro-btn.active { background:var(--am); color:white; border-color:var(--am); }
    .empty { text-align:center; padding:48px 16px; color:var(--text-3); font-size:13px; }

    /* Modal rechazo */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
    .modal-box { background:var(--bg-card); border-radius:var(--radius-m); padding:24px; max-width:420px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,.2); }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-area">
    <div class="topbar">
      <div>
        <div class="topbar-title">Indicadores propuestos</div>
        <div class="topbar-sub">Revisa y aprueba las propuestas de los docentes</div>
      </div>
    </div>
    <div class="page-content">
      <div id="loading" class="loading">Cargando...</div>
      <div id="content" style="display:none;">
        <div class="filtros">
          <button class="filtro-btn active" onclick="filtrar('pendiente')">Pendientes</button>
          <button class="filtro-btn" onclick="filtrar('aprobado')">Aprobados</button>
          <button class="filtro-btn" onclick="filtrar('rechazado')">Rechazados</button>
          <button class="filtro-btn" onclick="filtrar('todos')">Todos</button>
        </div>
        <div id="lista"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal rechazar -->
<div class="modal-overlay" id="modal-rechazo">
  <div class="modal-box">
    <div style="font-weight:600;margin-bottom:8px;font-size:14px;">Rechazar propuesta</div>
    <div style="font-size:12px;color:var(--text-2);margin-bottom:10px;">Puedes dejar una nota para el docente (opcional).</div>
    <textarea id="nota-rechazo" rows="3" placeholder="Motivo del rechazo…"
      style="width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:13px;resize:vertical;font-family:inherit;"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
      <button onclick="cerrarRechazo()" style="padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius-s);background:transparent;cursor:pointer;font-size:13px;">Cancelar</button>
      <button onclick="confirmarRechazo()" style="padding:7px 14px;background:var(--co);color:white;border:none;border-radius:var(--radius-s);cursor:pointer;font-weight:600;font-size:13px;">Rechazar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { requireAuth }        from '../js/auth.js'
  import { renderSidebarAdmin } from '../js/sidebar-admin.js'
  import { supabase }           from '../js/supabase.js'

  const profile = await requireAuth('admin')
  if (!profile) throw new Error('No autenticado')
  await renderSidebarAdmin('indicadores')

  let todasPropuestas = []
  let filtroActivo = 'pendiente'
  let _rechazandoId = null

  const { data } = await supabase
    .from('indicadores_propuestos')
    .select('*, profiles(nombre)')
    .order('created_at', { ascending: false })

  todasPropuestas = data || []
  document.getElementById('loading').style.display = 'none'
  document.getElementById('content').style.display = 'block'
  renderLista()

  window.filtrar = (estado) => {
    filtroActivo = estado
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'))
    event.target.classList.add('active')
    renderLista()
  }

  function renderLista() {
    const lista = document.getElementById('lista')
    const items = filtroActivo === 'todos'
      ? todasPropuestas
      : todasPropuestas.filter(p => p.estado === filtroActivo)

    if (!items.length) {
      lista.innerHTML = `<div class="empty">No hay propuestas ${filtroActivo === 'todos' ? '' : `en estado "${filtroActivo}"`}</div>`
      return
    }

    lista.innerHTML = items.map(p => {
      const fecha = new Date(p.created_at).toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' })
      const docente = p.profiles?.nombre || '—'
      const metaTags = [
        p.nivel && `Nivel: ${p.nivel}`,
        p.eje_articulador && `Eje: ${p.eje_articulador}`,
        p.contenido && `Contenido: ${p.contenido}`,
        p.bloom_nivel && `Bloom: ${p.bloom_nivel}`,
      ].filter(Boolean).map(t => `<span>${t}</span>`).join('')

      const estadoBadge = `<span class="estado-badge estado-${p.estado}">${p.estado}</span>`
      const notaRechazo = p.nota_admin ? `<div class="nota-rechazo">Nota admin: ${esc(p.nota_admin)}</div>` : ''

      const acciones = p.estado === 'pendiente' ? `
        <div class="prop-actions">
          <button class="btn-aprobar" onclick="aprobar('${p.id}')">✓ Aprobar</button>
          <button class="btn-rechazar" onclick="abrirRechazo('${p.id}')">✗ Rechazar</button>
          <button class="btn-eliminar" onclick="eliminar('${p.id}')">Eliminar</button>
        </div>` : `
        <div class="prop-actions">
          <button class="btn-eliminar" onclick="eliminar('${p.id}')">Eliminar</button>
        </div>`

      return `
        <div class="prop-card ${p.estado}" data-id="${p.id}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            ${estadoBadge}
            <span style="font-size:12px;font-weight:600;color:var(--text);">${esc(docente)}</span>
            <span style="font-size:11px;color:var(--text-3);margin-left:auto;">${fecha}</span>
          </div>
          <div class="prop-meta">${metaTags}</div>
          <div class="prop-texto">${esc(p.texto)}</div>
          ${notaRechazo}
          ${acciones}
        </div>`
    }).join('')
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }

  window.aprobar = async (id) => {
    const { error } = await supabase
      .from('indicadores_propuestos').update({ estado:'aprobado', nota_admin: null }).eq('id', id)
    if (error) return mostrarToast('Error: ' + error.message, 'error')
    const p = todasPropuestas.find(x => x.id === id)
    if (p) p.estado = 'aprobado'
    mostrarToast('Propuesta aprobada ✓')
    renderLista()
  }

  window.abrirRechazo = (id) => {
    _rechazandoId = id
    document.getElementById('nota-rechazo').value = ''
    document.getElementById('modal-rechazo').style.display = 'flex'
  }

  window.cerrarRechazo = () => {
    document.getElementById('modal-rechazo').style.display = 'none'
    _rechazandoId = null
  }

  window.confirmarRechazo = async () => {
    const nota = document.getElementById('nota-rechazo').value.trim()
    const { error } = await supabase
      .from('indicadores_propuestos').update({ estado:'rechazado', nota_admin: nota || null }).eq('id', _rechazandoId)
    if (error) return mostrarToast('Error: ' + error.message, 'error')
    const p = todasPropuestas.find(x => x.id === _rechazandoId)
    if (p) { p.estado = 'rechazado'; p.nota_admin = nota || null }
    cerrarRechazo()
    mostrarToast('Propuesta rechazada')
    renderLista()
  }

  window.eliminar = async (id) => {
    if (!confirm('¿Eliminar esta propuesta permanentemente?')) return
    const { error } = await supabase.from('indicadores_propuestos').delete().eq('id', id)
    if (error) return mostrarToast('Error: ' + error.message, 'error')
    todasPropuestas = todasPropuestas.filter(x => x.id !== id)
    mostrarToast('Eliminada')
    renderLista()
  }

  function mostrarToast(msg, tipo='ok') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.style.background = tipo === 'error' ? 'var(--co)' : 'var(--vd)'
    t.style.display = 'block'
    setTimeout(() => t.style.display = 'none', 3000)
  }
</script>
</body>
</html>
